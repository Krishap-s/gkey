<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- D-Bus policy of gkey-service.  The service identifies every caller
     and only ever acts on the caller's own credentials. -->
<busconfig>
  <policy user="gkey">
    <allow own="io.github.krishap_s.Gkey1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.krishap_s.Gkey1"
           send_interface="io.github.krishap_s.Gkey1"/>
    <allow send_destination="io.github.krishap_s.Gkey1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.krishap_s.Gkey1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
